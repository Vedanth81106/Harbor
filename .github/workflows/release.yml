name: Build and push images

on:
  push:
    branches: [ "main" ]
permissions:
  contents: read
  packages: write

jobs:
  buildx:
    runs-on: ubuntu-latest

    steps:

      # Setup docker buildx(duh)
      - name: Set up docker buildx
        uses: docker/setup-buildx-action@v4

      # Authenticate with GHCR
      - name: Log in to GHCR
        uses: docker/login-action