name: GHCR Image build
on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  buildx:
    runs-on: ubuntu-latest

    steps:
    
      - name: Check out repo
        uses: actions/checkout@v5

      # Setup docker buildx(duh)
      - name: Set up docker buildx
        uses: docker/setup-buildx-action@v4

      # Authenticate with GHCR
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }} # -> user that triggered the workflow
          password: ${{ secrets.GITHUB_TOKEN }}
      
      # Build and push the backend
      - name: Build backend docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
              ghcr.io/vedanth81106/harbor-backend:latest
              ghcr.io/vedanth81106/harbor-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build and push the frontend
      - name: Build frontend docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
              ghcr.io/vedanth81106/harbor-frontend:latest
              ghcr.io/vedanth81106/harbor-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

