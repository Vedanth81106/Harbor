name: Harbor CI/CD

on:
  pull_request:
    branches: ["main"]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/**'

  push:
    branches: ["main"]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/**'

# No permissions by default.
# Each job receives only what it needs.
permissions: {}

jobs:

  backend_ci:
    name: Backend CI
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Build with Maven
        run: ./mvnw --batch-mode --no-transfer-progress clean verify


  frontend_ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://harbor.webwaffles.me
          NEXT_PUBLIC_DEPLOY_DOMAIN: webwaffles.me


  build_and_publish:
    name: Build and Publish Images
    runs-on: ubuntu-latest

    needs:
      - backend_ci
      - frontend_ci

    # Only publish images when changes reach main.
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/vedanth81106/harbor-backend:latest
            ghcr.io/vedanth81106/harbor-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/vedanth81106/harbor-frontend:latest
            ghcr.io/vedanth81106/harbor-frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_DEPLOY_DOMAIN=webwaffles.me
            NEXT_PUBLIC_SITE_URL=https://harbor.webwaffles.me
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend


  deploy:
    name: Deploy to Donuts
    runs-on: ubuntu-latest

    needs: build_and_publish

    # Never deploy from a pull request.
    if: github.event_name == 'push'

    permissions:
      id-token: write

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:cicd

      - name: Deploy to Donuts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DONUTS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DONUTS_KNOWN_HOSTS }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh -i ~/.ssh/id_ed25519 \
            vedanth@donuts \
            "cd /opt/harbor &&
             export IMAGE_TAG='$IMAGE_TAG' &&
             docker compose pull spring frontend &&
             docker compose up -d --no-deps spring frontend"
