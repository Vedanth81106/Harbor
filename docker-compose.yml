services:
  db:
    image: postgres:18-alpine
    container_name: harbor_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PWD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - harbor_db_data:/var/lib/postgresql
    networks:
      - harbor-network

  spring:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: harbor_backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PWD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      DOMAIN_NAME: ${DOMAIN}
      CONFIG_PATH: /harbor-workspace
    depends_on:
      db:
        condition: service_healthy
    networks:
      - harbor-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HARBOR_WORKSPACE:-./tmp}:/harbor-workspace

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_DEPLOY_DOMAIN: ${NEXT_PUBLIC_DEPLOY_DOMAIN:-${DOMAIN:-}}
    container_name: harbor_frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      # Reached over harbor-network; never published or routed publicly.
      INTERNAL_API_URL: http://spring:8080
    depends_on:
      - spring
    networks:
      - harbor-network
      - harbor-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=harbor-proxy"
      - "traefik.http.routers.harbor-frontend.entrypoints=web"
      - "traefik.http.routers.harbor-frontend.rule=Host(`${FRONTEND_HOST:-harbor.${DOMAIN:-localhost}}`)"
      - "traefik.http.services.harbor-frontend.loadbalancer.server.port=3000"

  traefik:
    image: "traefik:v3.6"
    container_name: "traefik"
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=harbor-proxy"
      - "--entrypoints.web.address=:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - "harbor-proxy"

  cloudflared:
    image: "cloudflare/cloudflared:latest"
    container_name: "harbor-cloudflare"
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TOKEN}
    command: tunnel --no-autoupdate run
    networks:
      - harbor-proxy #since traefik is already on this network, we will put cf on the same network so that they can talk to each other

volumes:
  harbor_db_data:

networks:
  harbor-iso:
    name: harbor-iso
    driver: bridge
  harbor-network:
    name: harbor-network
    driver: bridge
  harbor-proxy:
    name: harbor-proxy
    driver: bridge