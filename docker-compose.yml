services:
  db:
    image: postgres:18-alpine
    container_name: harbor_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PWD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:5433:5432" # bound to the local machine
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    # To prevent data loss on restart:
    volumes:
      - harbor_db_data:/var/lib/postgresql
    networks:
      - harbor-network

  spring:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: harbor_backend
    ports:
      - 8080:8080
    # traefik will handle ports to serve backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PWD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CONFIG_PATH: /home/vedanth/Harbor/tmp
    depends_on:
      db:
        condition: service_healthy
    networks:
      - harbor-network
      - harbor-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/vedanth/Harbor/tmp:/home/tmp/Harbor

  traefik:
    image: "traefik:v3.6"
    container_name: "traefik"
    command:
      #- "--log.level=DEBUG"
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=harbor-proxy"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - "harbor-network"
      - "harbor-proxy"

volumes:
  harbor_db_data:

networks:
  harbor-network:
    name: harbor-network
    driver: bridge
  harbor-proxy:
    name: harbor-proxy
    driver: bridge