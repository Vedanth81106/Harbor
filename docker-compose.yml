services:
  db:
    image: postgres:latest
    container_name: harbor_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PWD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    # To prevent data loss on restart:
    volumes:
      - harbor_db_data:/var/lib/postgresql
    networks:
      - harbor-network

  spring:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: harbor_backend
    ports:
      - "8000:8000"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PWD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - harbor-network

volumes:
  harbor_db_data:

networks:
  harbor-network:
    driver: bridge